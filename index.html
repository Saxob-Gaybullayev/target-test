<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Target kursi — testlar</title>
  <link rel="stylesheet" href="style.css?v=8">
  <link rel="stylesheet" href="fon.css?v=8">
  <script>try { var _t = localStorage.getItem("tt_theme"); if (_t) document.documentElement.dataset.theme = _t; } catch (e) {}</script>
</head>
<body>
<!-- fon bezaklari (mavzuga qarab) -->
<div class="deco" aria-hidden="true">
  <svg class="deco-waves" viewBox="0 0 1200 400" preserveAspectRatio="none">
    <defs>
      <linearGradient id="wg1" x1="0" x2="1"><stop offset="0" class="w-s0"/><stop offset=".55" class="w-s1"/><stop offset="1" class="w-s2"/></linearGradient>
      <linearGradient id="wg2" x1="0" x2="1"><stop offset="0" class="w-s2"/><stop offset=".5" class="w-s0"/><stop offset="1" class="w-s1"/></linearGradient>
      <linearGradient id="wfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="w-f0"/><stop offset="1" class="w-f1"/></linearGradient>
      <linearGradient id="wfade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".7" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <mask id="wmask"><rect width="1200" height="400" fill="url(#wfade)"/></mask>
      <filter id="wglow" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <path class="w-area" d="M0 300 C 220 180, 420 330, 640 250 S 1000 120, 1200 170 L1200 400 L0 400 Z" fill="url(#wg1)" mask="url(#wmask)"/>
    <path class="w-area2" d="M0 340 C 240 250, 460 360, 680 300 S 1020 190, 1200 230 L1200 400 L0 400 Z" fill="url(#wg2)" mask="url(#wmask)"/>
    <g class="w-lines" filter="url(#wglow)" fill="none">
      <path d="M-20 290 C 220 170, 420 320, 640 245 S 1000 115, 1220 165" stroke="url(#wg1)" stroke-width="5"/>
      <path d="M-20 310 C 230 200, 430 340, 650 268 S 1010 140, 1220 190" stroke="url(#wg1)" stroke-width="2.2" opacity=".8"/>
      <path d="M-20 330 C 240 230, 440 355, 660 290 S 1020 170, 1220 215" stroke="url(#wg2)" stroke-width="1.4" opacity=".7"/>
      <path d="M-20 350 C 250 260, 450 370, 670 312 S 1030 200, 1220 240" stroke="url(#wg2)" stroke-width="3" opacity=".55"/>
    </g>
    <g class="w-spark"></g>
  </svg>
</div>

<!-- ================= KIRISH / RO'YXATDAN O'TISH ================= -->
<div id="authView" class="auth-wrap hidden">
  <div class="auth-card">
    <h1 id="siteTitle">Target kursi — testlar</h1>
    <div class="muted small">Darslar bo'yicha bilimingizni tekshiring</div>
    <div class="tabs">
      <button id="tabLogin" class="active" type="button">Kirish</button>
      <button id="tabReg" type="button">Ro'yxatdan o'tish</button>
    </div>

    <form id="loginForm" autocomplete="on">
      <label class="field"><span>Telegram username yoki link</span>
        <input type="text" id="lTg" placeholder="@username yoki t.me/username" required></label>
      <div class="field"><span>PIN (4 ta raqam)</span>
        <div class="otp" id="otp">
          <div class="otp-spin"><div class="otp-slot"></div><div class="otp-slot"></div><div class="otp-slot"></div><div class="otp-slot"></div></div>
          <div class="otp-done"><div class="otp-box"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></svg></div><div class="otp-ok">Xush kelibsiz!</div></div>
          <input type="password" id="lPin" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required autocomplete="current-password" aria-label="PIN (4 ta raqam)">
        </div>
      </div>
      <div id="loginMsg"></div>
      <button class="btn primary" style="width:100%" type="submit">Kirish</button>
    </form>

    <form id="regForm" class="hidden" autocomplete="on">
      <label class="field"><span>Ism</span><input type="text" id="rFirst" required></label>
      <label class="field"><span>Familiya</span><input type="text" id="rLast" required></label>
      <label class="field"><span>Telegram username yoki link</span>
        <input type="text" id="rTg" placeholder="@username yoki t.me/username" required></label>
      <label class="field"><span>PIN o'ylab toping (4 ta raqam)</span>
        <input type="password" id="rPin" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required></label>
      <label class="field"><span>PIN'ni qayta kiriting</span>
        <input type="password" id="rPin2" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required></label>
      <div class="msg warn small">PIN'ni eslab qoling. Unutsangiz, ustozga Telegram'da yozing.</div>
      <div id="regMsg"></div>
      <button class="btn primary" style="width:100%" type="submit">Ro'yxatdan o'tish</button>
    </form>
  </div>
</div>

<!-- ================= ASOSIY OYNA ================= -->
<div id="appView" class="hidden">
  <div class="topbar">
    <button class="btn sm" id="menuBtn" type="button">☰ Menyu</button>
    <b id="topTitle" class="small"></b>
  </div>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="head">
        <b id="sideTitle">Target kursi</b>
        <div class="me"><span class="ava" id="ava">👤</span><span class="muted small" id="meName"></span></div>
      </div>
      <nav id="nav"></nav>
      <div class="foot">
        <button class="btn sm" id="historyBtn" type="button">📊 Natijalarim</button>
        <button class="btn sm" id="logoutBtn" type="button">Chiqish</button>
        <button class="btn sm icon" id="themeBtn" type="button" title="Fonni tanlash" aria-label="Fonni tanlash">🎨</button>
      </div>
    </aside>
    <div id="shade" class="shade hidden"></div>
    <main class="main"><div class="content" id="content"></div></main>
  </div>
</div>

<!-- fon tanlash oynasi -->
<div id="themeBox" class="theme-box hidden" role="dialog" aria-modal="true" aria-labelledby="themeTitle">
  <div class="theme-card">
    <div class="row"><b id="themeTitle">🎨 Fonni tanlang</b><span class="space"></span><button class="btn sm" id="themeClose" type="button">✕</button></div>
    <p class="muted small" style="margin:6px 0 14px">Tanlovingiz shu qurilmada saqlanadi.</p>
    <div class="theme-grid" id="themeGrid"></div>
  </div>
</div>

<div id="zoom" class="zoom hidden" onclick="this.classList.add('hidden')"><img id="zoomImg" alt=""><span class="zoom-x">✕</span></div>
<script>window.zoomImg = src => { document.getElementById('zoomImg').src = src; document.getElementById('zoom').classList.remove('hidden'); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('zoom').classList.add('hidden'); });</script>
<script src="config.js?v=8"></script>
<script src="api.js?v=8"></script>
<script>
(function () {
  const CFG = window.APP_CONFIG, MAX = CFG.MAX_ATTEMPTS || 3;
  const $ = id => document.getElementById(id);
  const esc = U.esc;
  const ERR = {
    name_invalid: "Ism va familiyani to'liq yozing.",
    telegram_invalid: "Telegram username noto'g'ri. Masalan: @username yoki t.me/username (kamida 5 ta belgi).",
    pin_invalid: "PIN aynan 4 ta raqamdan iborat bo'lsin.",
    telegram_taken: "Bu Telegram bilan allaqachon ro'yxatdan o'tilgan. \"Kirish\" bo'limidan kiring.",
    not_found: "Bunday Telegram bilan ro'yxatdan o'tilmagan.",
    wrong_pin: "PIN noto'g'ri.",
    locked: "Ko'p marta xato PIN kiritildi. 15 daqiqadan keyin urinib ko'ring.",
    no_session: "Sessiya tugagan. Qaytadan kiring.",
    no_attempts: "Bu test uchun 3 ta urinish tugagan.",
    perfect: "Siz bu testni 100% topshirgansiz.",
    no_test: "Test topilmadi.",
    already_finished: "Bu urinish allaqachon yakunlangan."
  };
  const errText = r => ERR[r && r.error] || (r && r.error) || "Noma'lum xato";

  let token = U.store.get("tt_token");
  let tests = [];
  let current = null; // ochiq test
  let run = null;     // ketayotgan urinish

  document.title = CFG.SITE_TITLE; $("siteTitle").textContent = CFG.SITE_TITLE; $("sideTitle").textContent = CFG.SITE_TITLE;

  // ---------- kirish / ro'yxat ----------
  function showTab(reg) {
    $("tabReg").classList.toggle("active", reg); $("tabLogin").classList.toggle("active", !reg);
    $("regForm").classList.toggle("hidden", !reg); $("loginForm").classList.toggle("hidden", reg);
  }
  $("tabLogin").onclick = () => showTab(false);
  $("tabReg").onclick = () => showTab(true);

  function msg(el, text, type = "err") { $(el).innerHTML = text ? `<div class="msg ${type}">${esc(text)}</div>` : ""; }

  // PIN kataklari (4 ta) va kirish animatsiyasi
  const otp = $("otp"), pinEl = $("lPin"), slots = [...otp.querySelectorAll(".otp-slot")];
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  let loginBusy = false;
  function paintOtp() {
    const v = pinEl.value.replace(/\D/g, "").slice(0, 4);
    if (v !== pinEl.value) pinEl.value = v;
    const focused = document.activeElement === pinEl;
    slots.forEach((s, i) => {
      s.textContent = v[i] ? "•" : "";
      s.classList.toggle("filled", !!v[i]);
      s.classList.toggle("cur", focused && i === Math.min(v.length, 3));
    });
  }
  pinEl.addEventListener("input", () => {
    paintOtp();
    if (pinEl.value.length === 4 && $("lTg").value.trim() && !loginBusy) $("loginForm").requestSubmit();
  });
  pinEl.addEventListener("focus", paintOtp); pinEl.addEventListener("blur", paintOtp);
  paintOtp();

  $("loginForm").onsubmit = async e => {
    e.preventDefault(); if (loginBusy) return;
    msg("loginMsg", ""); loginBusy = true;
    const btn = $("loginForm").querySelector("button[type=submit]"); btn.disabled = true;
    otp.className = "otp orbit"; pinEl.blur();
    const t0 = Date.now(); let r = null, netErr = null;
    try { r = await API.rpc("login", { p_telegram: $("lTg").value, p_pin: pinEl.value }); }
    catch (err) { netErr = err; }
    const wait = 1100 - (Date.now() - t0); if (wait > 0) await sleep(wait);
    if (r && r.ok) {
      otp.classList.add("ok"); await sleep(500);
      otp.classList.add("collapse"); await sleep(380);
      const done = otp.querySelector(".otp-done");
      for (let i = 0; i < 14; i++) {
        const s = document.createElement("span"); s.className = "otp-spark";
        s.style.setProperty("--a", (i * 360 / 14 + Math.random() * 12) + "deg");
        s.style.setProperty("--d", (120 + Math.random() * 160) + "ms");
        done.appendChild(s);
      }
      otp.classList.add("done"); await sleep(1250);
      token = r.token; U.store.set("tt_token", token); start();
      return;
    }
    otp.className = "otp err"; await sleep(650);
    otp.className = "otp"; pinEl.value = ""; paintOtp();
    btn.disabled = false; loginBusy = false;
    if (netErr) return msg("loginMsg", "Ulanishda xato: " + netErr.message);
    let t = errText(r); if (r && r.error === "wrong_pin" && r.left) t += ` Yana ${r.left} ta urinish qoldi.`;
    msg("loginMsg", t); pinEl.focus();
  };

  $("regForm").onsubmit = async e => {
    e.preventDefault(); msg("regMsg", "");
    if ($("rPin").value !== $("rPin2").value) return msg("regMsg", "PIN'lar bir xil emas.");
    try {
      const r = await API.rpc("register", {
        p_first: $("rFirst").value, p_last: $("rLast").value, p_telegram: $("rTg").value, p_pin: $("rPin").value
      });
      if (!r.ok) return msg("regMsg", errText(r));
      token = r.token; U.store.set("tt_token", token); start();
    } catch (err) { msg("regMsg", "Ulanishda xato: " + err.message); }
  };

  $("logoutBtn").onclick = () => {
    if (run && !confirm("Test yakunlanmagan. Chiqsangiz, bu urinish yo'qoladi. Chiqasizmi?")) return;
    run = null; U.store.del("tt_token"); token = null; location.reload();
  };

  // ---------- online vaqtni hisoblash ----------
  let visitId = null;
  async function ping() {
    if (!token || document.visibilityState !== "visible") return;
    try { const r = await API.rpc("ping", { p_token: token, p_visit: visitId }); if (r.ok) visitId = r.visit; } catch (e) {}
  }
  setInterval(ping, 30000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") ping(); });

  // ---------- boshlash ----------
  async function start() {
    if (!token) { $("authView").classList.remove("hidden"); return; }
    let me;
    try { me = await API.rpc("me", { p_token: token }); } catch (e) { me = null; }
    if (!me || !me.ok) {
      U.store.del("tt_token"); token = null; $("authView").classList.remove("hidden");
      if (me) msg("loginMsg", errText(me), "warn"); return;
    }
    $("authView").classList.add("hidden"); $("appView").classList.remove("hidden");
    $("meName").textContent = `${me.first_name} ${me.last_name} · @${me.telegram}`;
    $("ava").textContent = ((me.first_name || "?")[0] || "?").toUpperCase();
    ping();
    await loadNav();
    const last = U.store.get("tt_last_test");
    if (last && tests.some(t => t.id === last)) openTest(last); else welcome();
  }

  // ---------- chap menyu ----------
  async function loadNav() {
    tests = await API.rpc("list_tests");
    let history = [];
    try { const h = await API.rpc("my_history", { p_token: token }); if (h.ok) history = h.items; } catch (e) {}
    const done = {};
    history.forEach(a => { if (a.finished_at) { done[a.test_id] = done[a.test_id] || []; done[a.test_id].push(a); } });

    const sections = [];
    tests.forEach(t => {
      let s = sections.find(x => x.name === t.section);
      if (!s) { s = { name: t.section, items: [] }; sections.push(s); }
      s.items.push(t);
    });
    const closed = JSON.parse(U.store.get("tt_closed") || "[]");
    const openSub = JSON.parse(U.store.get("tt_opensub") || "{}");
    const bestOf = t => { const d = done[t.id] || []; return d.length ? Math.max(...d.map(a => a.score)) : 0; };
    const ring = (pct, cls) => `<span class="ring ${cls}" style="--p:${pct}" title="${pct}%"><b>${pct}%</b></span>`;
    $("nav").innerHTML = sections.map(s => {
      const tot = s.items.reduce((a, t) => a + t.count, 0), got = s.items.reduce((a, t) => a + bestOf(t), 0);
      const secPct = tot ? Math.round(got / tot * 100) : 0;
      const groups = [["txt", "📝 Testlar", s.items.filter(t => !/r$/.test(t.id))], ["img", "🖼 Rasmli testlar", s.items.filter(t => /r$/.test(t.id))]].filter(g => g[2].length);
      return `
      <div class="sec ${closed.includes(s.name) ? "closed" : ""}" data-sec="${esc(s.name)}">
        <button class="sec-title" type="button"><span>${esc(s.name)}</span><span class="sec-right">${ring(secPct, "pink big")}<span class="arrow">▾</span></span></button>
        <div class="sec-items">
          ${groups.map(([key, label, list]) => `<div class="sub ${openSub[s.name] === key ? "" : "closed"}" data-key="${key}">
            <button class="sub-title" type="button"><span>${label}</span><span class="arrow">▾</span></button>
            <div class="sub-items">` + list.map(t => {
            const d = done[t.id] || []; const n = d.length;
            const best = bestOf(t), pct = t.count ? Math.round(best / t.count * 100) : 0;
            const cls = (n >= MAX || (n && best === t.count)) ? "ok" : n ? "warn" : "";
            return `<button class="nav-item" type="button" data-id="${esc(t.id)}"><span>${esc(t.title)}</span>
              <span class="item-right"><span class="badge ${cls}">${n ? `${best}/${t.count}` : "yangi"}</span>${ring(pct, "red")}</span></button>`;
          }).join("") + `</div></div>`).join("")}
        </div>
      </div>`; }).join("") || `<div class="muted small" style="padding:12px">Hozircha testlar yo'q.</div>`;

    $("nav").querySelectorAll(".sec-title").forEach(b => b.onclick = () => {
      const box = b.parentElement; box.classList.toggle("closed");
      const list = [...document.querySelectorAll(".sec.closed")].map(x => x.dataset.sec);
      U.store.set("tt_closed", JSON.stringify(list));
    });
    // bo'lim ichida faqat bitta guruh ochiq turadi
    $("nav").querySelectorAll(".sub-title").forEach(b => b.onclick = () => {
      const sub = b.parentElement, sec = sub.closest(".sec"), willOpen = sub.classList.contains("closed");
      sec.querySelectorAll(".sub").forEach(x => x.classList.add("closed"));
      if (willOpen) sub.classList.remove("closed");
      const st = JSON.parse(U.store.get("tt_opensub") || "{}");
      st[sec.dataset.sec] = willOpen ? sub.dataset.key : ""; U.store.set("tt_opensub", JSON.stringify(st));
    });
    $("nav").querySelectorAll(".nav-item").forEach(b => b.onclick = () => {
      if (run && !confirm("Test yakunlanmagan. Boshqa joyga o'tsangiz, bu urinish yo'qoladi. Davom etasizmi?")) return;
      run = null; closeMenu(); openTest(b.dataset.id);
    });
    markActive();
  }
  function markActive() {
    document.querySelectorAll(".nav-item").forEach(b => b.classList.toggle("active", current && b.dataset.id === current.id));
  }

  // telefon menyusi
  function closeMenu() { $("sidebar").classList.remove("open"); $("shade").classList.add("hidden"); }
  $("menuBtn").onclick = () => { $("sidebar").classList.add("open"); $("shade").classList.remove("hidden"); };
  $("shade").onclick = closeMenu;

  function setTop(t) { $("topTitle").textContent = t || ""; }

  function welcome() {
    current = null; markActive(); setTop("");
    $("content").innerHTML = `<div class="card hero"><h2>Xush kelibsiz! 👋</h2>
      <p>Chap menyudan darsni tanlang va testni boshlang.</p>
      <ul class="muted">
        <li>Har bir testga <b>${MAX} ta urinish</b> beriladi.</li>
        <li>To'g'ri javoblar faqat ${MAX}-urinishdan keyin ko'rsatiladi.</li>
        <li>Savollar va variantlar har safar aralashtiriladi.</li>
        <li>Test paytida boshqa oynaga o'tish qayd qilinadi.</li>
      </ul></div>`;
  }

  // ---------- test sahifasi ----------
  async function openTest(id) {
    $("content").innerHTML = `<div class="card muted">Yuklanmoqda...</div>`;
    const r = await API.rpc("get_test", { p_token: token, p_test_id: id });
    if (!r.ok) { if (r.error === "no_session") return relogin(); $("content").innerHTML = `<div class="card msg err">${esc(errText(r))}</div>`; return; }
    current = r; U.store.set("tt_last_test", id); markActive(); setTop(r.title);
    const left = r.perfect ? 0 : r.max - r.used;
    const mine = await myAttempts(id);
    $("content").innerHTML = `
      <div class="card">
        <div class="muted small">${esc(r.section)}</div>
        <h2>${esc(r.title)}</h2>
        <div class="stats">
          <div class="stat"><span class="muted small">Savollar</span><b>${r.questions.length}</b></div>
          <div class="stat"><span class="muted small">Urinishlar</span><b>${r.used} / ${r.max}</b></div>
          <div class="stat"><span class="muted small">Eng yaxshi natija</span><b>${mine.some(a => a.finished_at) ? Math.max(...mine.filter(a => a.finished_at).map(a => a.score)) + " / " + r.questions.length : "—"}</b></div>
        </div>
        ${mine.length ? `<div class="table-wrap"><table><tr><th>Urinish</th><th>Boshlagan</th><th>Vaqt</th><th>Natija</th></tr>
          ${mine.slice().reverse().map(a => `<tr><td>${a.attempt_no}</td><td>${U.dt(a.started_at)}</td>
            <td>${a.finished_at ? U.dur(a.seconds) : `<span class="badge bad">tugallanmagan</span>`}</td>
            <td>${a.finished_at ? `<b>${a.score}</b> / ${a.total}` : "—"}</td></tr>`).join("")}</table></div>` : ""}
        <div class="row" style="margin-top:16px">
          ${left > 0 ? `<button class="btn primary" id="startBtn" type="button">${r.used ? "Keyingi urinishni boshlash" : "Testni boshlash"} (${left} ta qoldi)</button>`
                     : r.perfect ? `<span class="badge ok">🎉 100% — test topshirildi</span>` : `<span class="badge ok">Barcha urinishlar tugagan</span>`}
          ${r.used >= r.max || r.perfect ? `<button class="btn" id="reviewBtn" type="button">✅ To'g'ri javoblarni ko'rish</button>` : ""}
        </div>
        ${left > 0 ? `<p class="muted small" style="margin-top:12px">Boshlaganingizdan keyin sahifani yopsangiz ham urinish hisoblanadi. Test paytida boshqa oyna yoki ilovaga o'tish qayd qilinadi.</p>` : ""}
      </div>`;
    if ($("startBtn")) $("startBtn").onclick = startAttempt;
    if ($("reviewBtn")) $("reviewBtn").onclick = () => showReview(id);
  }

  async function myAttempts(id) {
    try { const h = await API.rpc("my_history", { p_token: token }); return h.ok ? h.items.filter(a => a.test_id === id).sort((a, b) => a.attempt_no - b.attempt_no) : []; }
    catch (e) { return []; }
  }

  function relogin() { U.store.del("tt_token"); location.reload(); }

  // ---------- urinish ----------
  async function startAttempt() {
    $("startBtn").disabled = true;
    const r = await API.rpc("start_attempt", { p_token: token, p_test_id: current.id });
    if (!r.ok) { alert(errText(r)); return openTest(current.id); }
    run = {
      id: r.attempt_id, no: r.attempt_no,
      questions: U.shuffle(current.questions).map(q => ({ ...q, options: q.keep_order ? q.options : U.shuffle(q.options) })),
      i: 0, answers: {}, ms: {}, shownAt: performance.now(),
      away: [], awayStart: null
    };
    renderQuestion();
  }

  // boshqa oynaga chiqishni qayd qilish
  function goAway() { if (run && run.awayStart == null) run.awayStart = Date.now(); }
  function comeBack() {
    if (run && run.awayStart != null) {
      const back = Date.now();
      run.away.push({ left: new Date(run.awayStart).toISOString(), back: new Date(back).toISOString(),
                      sec: Math.round((back - run.awayStart) / 1000), q: run.i + 1 });
      run.awayStart = null;
      renderAwayNote();
    }
  }
  document.addEventListener("visibilitychange", () => document.visibilityState === "hidden" ? goAway() : comeBack());
  window.addEventListener("beforeunload", e => { if (run) { e.preventDefault(); e.returnValue = ""; } });

  function renderAwayNote() {
    const el = $("awayNote"); if (!el || !run) return;
    el.innerHTML = run.away.length ? `<div class="msg warn small">Test oynasidan ${run.away.length} marta chiqdingiz. Bu ustozga ko'rinadi.</div>` : "";
  }

  function renderQuestion() {
    const q = run.questions[run.i], n = run.questions.length, last = run.i === n - 1;
    $("content").innerHTML = `
      <div class="card">
        <div class="row"><span class="muted small">${esc(current.title)} · ${run.no}-urinish</span><span class="space"></span>
          <span class="badge">${run.i + 1} / ${n}</span></div>
        <div class="progress"><div style="width:${Object.keys(run.answers).length / n * 100}%"></div></div>
        <div class="q-nav">${run.questions.map((x, k) => `<button type="button" class="q-dot ${k === run.i ? "cur" : ""} ${run.answers[x.id] ? "done" : ""}" data-k="${k}">${k + 1}</button>`).join("")}</div>
        <p class="q-prompt">${esc(q.prompt)}</p>
        ${q.image ? `<img class="q-img" src="${esc(q.image)}" alt="Savol rasmi" title="Kattalashtirish uchun bosing" onclick="window.zoomImg(this.src)">` : ""}
        <div id="opts">${q.options.map(o => `<button type="button" class="opt ${run.answers[q.id] === o.id ? "sel" : ""}" data-id="${esc(o.id)}">${esc(o.text)}</button>`).join("")}</div>
        <div id="awayNote"></div>
        <div class="row" style="margin-top:8px">
          ${run.i > 0 ? `<button class="btn" id="prevBtn" type="button">← Orqaga</button>` : ""}
          <span class="space"></span>
          <button class="btn primary" id="nextBtn" type="button" ${run.answers[q.id] ? "" : "disabled"}>${last ? "Testni tugatish ✓" : "Keyingi →"}</button>
        </div>
        <div id="finishNote"></div>
      </div>`;
    renderAwayNote();
    run.shownAt = performance.now();
    $("opts").querySelectorAll(".opt").forEach(b => b.onclick = () => {
      run.answers[q.id] = b.dataset.id;
      $("opts").querySelectorAll(".opt").forEach(x => x.classList.toggle("sel", x === b));
      $("nextBtn").disabled = false;
    });
    const leave = () => { run.ms[q.id] = (run.ms[q.id] || 0) + Math.round(performance.now() - run.shownAt); };
    const go = k => { leave(); run.confirm = false; run.i = k; renderQuestion(); };
    if ($("prevBtn")) $("prevBtn").onclick = () => go(run.i - 1);
    $("content").querySelectorAll(".q-dot").forEach(b => b.onclick = () => { const k = +b.dataset.k; if (k !== run.i) go(k); });
    $("nextBtn").onclick = () => {
      if (!last) return go(run.i + 1);
      const miss = run.questions.map((x, k) => run.answers[x.id] ? null : k + 1).filter(Boolean);
      if (miss.length) { $("finishNote").innerHTML = `<div class="msg warn small">Javob berilmagan savollar: ${miss.join(", ")}. Yuqoridagi raqamlarni bosib o'ting.</div>`; return; }
      if (!run.confirm) { run.confirm = true; $("nextBtn").textContent = "Ha, tugatish ✓";
        $("finishNote").innerHTML = `<div class="msg warn small">Tugatgandan keyin javoblarni o'zgartirib bo'lmaydi. Ishonchingiz komil bo'lsa, yana bir marta bosing.</div>`; return; }
      leave(); finish();
    };
  }

  async function finish() {
    comeBack();
    $("nextBtn").disabled = true; $("nextBtn").textContent = "Yuborilmoqda...";
    const answers = run.questions.map(q => ({ q: q.id, a: run.answers[q.id] || null, ms: run.ms[q.id] || 0 }));
    let r;
    try { r = await API.rpc("finish_attempt", { p_token: token, p_attempt_id: run.id, p_answers: answers, p_away: run.away }); }
    catch (e) { $("nextBtn").disabled = false; $("nextBtn").textContent = "Qayta yuborish"; alert("Internet bilan muammo. Qayta bosing."); return; }
    if (!r.ok) { alert(errText(r)); run = null; return openTest(current.id); }
    const id = current.id; run = null;
    const pct = Math.round(r.score / r.total * 100);
    $("content").innerHTML = `
      <div class="card" style="text-align:center">
        <div class="muted">${esc(current.title)} · ${r.attempt_no}-urinish</div>
        <div class="big-score">${r.score} / ${r.total}</div>
        <div class="badge ${pct >= 80 ? "ok" : pct >= 50 ? "warn" : "bad"}">${pct}%</div>
        <p class="muted">${r.perfect ? "🎉 Barakalla! Hamma savolga to'g'ri javob berdingiz. Test topshirildi." : r.review_open ? "Barcha urinishlar tugadi. Endi to'g'ri javoblarni ko'rishingiz mumkin."
          : `Yana ${MAX - r.attempt_no} ta urinish qoldi. To'g'ri javoblar ${MAX}-urinishdan keyin ochiladi.`}</p>
        <div class="row" style="justify-content:center">
          ${r.review_open ? `<button class="btn primary" id="rv" type="button">✅ To'g'ri javoblarni ko'rish</button>` : ""}
          <button class="btn" id="back" type="button">Test sahifasiga qaytish</button>
        </div>
      </div>`;
    if ($("rv")) $("rv").onclick = () => showReview(id);
    $("back").onclick = () => openTest(id);
    loadNav();
  }

  // ---------- to'g'ri javoblar ----------
  async function showReview(id) {
    const r = await API.rpc("get_review", { p_token: token, p_test_id: id });
    if (!r.ok) return alert(errText(r));
    const mine = {}; (r.last_answers || []).forEach(a => mine[a.q] = a.a);
    $("content").innerHTML = `
      <div class="card"><div class="row"><h2>${esc(r.title)}: to'g'ri javoblar</h2><span class="space"></span>
        <button class="btn sm" id="back" type="button">← Orqaga</button></div>
        <p class="muted small">Yashil: to'g'ri javob. Qizil: oxirgi urinishdagi xato javobingiz.</p></div>
      ${r.questions.map((q, i) => `
        <div class="card">
          <p class="q-prompt">${i + 1}. ${esc(q.prompt)}</p>
          ${q.image ? `<img class="q-img" src="${esc(q.image)}" alt="Savol rasmi" title="Kattalashtirish uchun bosing" onclick="window.zoomImg(this.src)">` : ""}
          ${q.options.map(o => {
            const cls = o.id === q.correct_option_id ? "right" : (mine[q.id] === o.id ? "wrong" : "");
            return `<div class="opt ${cls}" style="cursor:default">${esc(o.text)}</div>`;
          }).join("")}
          ${q.explanation ? `<div class="explain">💡 ${esc(q.explanation)}</div>` : ""}
        </div>`).join("")}`;
    $("back").onclick = () => openTest(id);
    window.scrollTo(0, 0);
  }

  const IC = {
    book: '<svg viewBox="0 0 24 24"><path d="M3 5.5C5.5 4 9 4 12 6c3-2 6.5-2 9-.5V19c-2.5-1.5-6-1.5-9 .5-3-2-6.5-2-9-.5z M12 6v13.5"/></svg>',
    check: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M7.5 12.3l3 3 6-6.3"/></svg>',
    cup: '<svg viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0z M7 6H4v1.5A3.5 3.5 0 0 0 7.5 11 M17 6h3v1.5a3.5 3.5 0 0 1-3.5 3.5 M12 14v4 M8 20h8"/></svg>'
  };
  // ---------- natijalarim ----------
  $("historyBtn").onclick = async () => {
    if (run && !confirm("Test yakunlanmagan. Chiqsangiz, bu urinish yo'qoladi. Davom etasizmi?")) return;
    run = null; closeMenu(); current = null; markActive(); setTop("Natijalarim");
    const h = await API.rpc("my_history", { p_token: token });
    if (!h.ok) return relogin();
    const by = {};
    h.items.forEach(a => { (by[a.test_id] = by[a.test_id] || { title: a.title, section: a.section, list: [] }).list.push(a); });
    const ids = Object.keys(by);
    const bestBy = {}; h.items.forEach(a => { if (a.finished_at) bestBy[a.test_id] = Math.max(bestBy[a.test_id] || 0, a.score); });
    const tot = tests.reduce((s, t) => s + t.count, 0), got = tests.reduce((s, t) => s + (bestBy[t.id] || 0), 0);
    const doneN = tests.filter(t => t.id in bestBy).length, pctAll = tot ? Math.round(got / tot * 100) : 0;
    $("content").innerHTML = `<div class="card hero"><h2>📊 Mening <span class="accent">natijalarim</span></h2>
      <p class="muted small">Bu yerda faqat sizning natijalaringiz ko'rinadi.</p></div>
      <div class="stats sum">
        <div class="stat"><span class="ic">${IC.book}</span><div><span class="muted small">Umumiy testlar</span><b>${tests.length}</b></div></div>
        <div class="stat"><span class="ic">${IC.check}</span><div><span class="muted small">Bajarilgan testlar</span><b>${doneN}</b></div></div>
        <div class="stat"><span class="ic">${IC.cup}</span><div><span class="muted small">Umumiy natija</span><b>${pctAll}%</b></div></div>
      </div>` +
      (ids.length ? ids.map(id => {
        const g = by[id]; g.list.sort((a, b) => a.attempt_no - b.attempt_no);
        return `<div class="card"><div class="muted small">${esc(g.section)}</div><h2 style="font-size:17px">${esc(g.title)}</h2>
          <div class="table-wrap"><table><tr><th>Urinish</th><th>Kirgan vaqti</th><th>Tugatgan vaqti</th><th>Sarflangan vaqt</th><th>Natija</th></tr>
          ${g.list.map(a => `<tr><td>${a.attempt_no}-urinish</td><td>${U.dt(a.started_at)}</td><td>${a.finished_at ? U.time(a.finished_at) : "—"}</td>
            <td>${a.finished_at ? U.dur(a.seconds) : `<span class="badge bad">tugallanmagan</span>`}</td>
            <td>${a.finished_at ? `<b>${a.score}</b> / ${a.total}` : "—"}</td></tr>`).join("")}
          </table></div></div>`;
      }).join("") : `<div class="card note">ⓘ&nbsp; Hali birorta test ishlamagansiz.</div>`);
  };

  // ---------- fon tanlash ----------
  const THEMES = [
    ["", "Standart", "#f3f7f4", "#0f5a3c", "#1f9d55"],
    ["neon", "Ko'k-binafsha neon", "#0a0f2c", "#7c4dff", "#3fa9ff"],
    ["emerald", "Yashil-oltin", "#04140f", "#12b981", "#f5c542"],
    ["trophy", "Yashil-oltin kubok", "#03110c", "#1fe0a0", "#f2b632"],
    ["lux", "Qora-oltin", "#0c0a10", "#e0b04a", "#8b4dff"],
    ["mtg", "Yashil tog'", "#061a17", "#1fd1a0", "#f2a93b"],
    ["mtb", "Ko'k tog'", "#071528", "#18d4f0", "#5a6bff"],
    ["lilac", "Och binafsha", "#f6f2ff", "#7a4be6", "#f59e2b"],
    ["mint", "Och yashil", "#f2faf6", "#0f7a4f", "#5fd3a0"]
  ];
  function setTheme(k) {
    if (k) document.documentElement.dataset.theme = k; else delete document.documentElement.dataset.theme;
    if (k) U.store.set("tt_theme", k); else U.store.del("tt_theme");
    $("themeGrid").querySelectorAll(".theme-opt").forEach(b => b.classList.toggle("on", b.dataset.k === k));
  }
  $("themeGrid").innerHTML = THEMES.map(([k, n, bg, a, b]) => `<button type="button" class="theme-opt" data-k="${k}">
    <span class="sw" style="background:linear-gradient(135deg, ${bg} 0 45%, ${a} 45% 72%, ${b} 72%)"></span><span>${n}</span></button>`).join("");
  $("themeGrid").querySelectorAll(".theme-opt").forEach(b => b.onclick = () => setTheme(b.dataset.k));
  $("themeBtn").onclick = () => { closeMenu(); setTheme(document.documentElement.dataset.theme || ""); $("themeBox").classList.remove("hidden"); };
  $("themeClose").onclick = () => $("themeBox").classList.add("hidden");
  $("themeBox").onclick = e => { if (e.target === $("themeBox")) $("themeBox").classList.add("hidden"); };
  // to'lqin ustidagi uchqunlar
  (function () {
    const g = document.querySelector(".w-spark"); let h = "";
    for (let i = 0; i < 70; i++) {
      const x = Math.random() * 1200, base = 300 - 140 * (x / 1200) + Math.sin(x / 140) * 40;
      h += `<circle cx="${x.toFixed(0)}" cy="${(base + (Math.random() - .5) * 90).toFixed(0)}" r="${(Math.random() * 1.6 + .4).toFixed(1)}" opacity="${(Math.random() * .7 + .2).toFixed(2)}"/>`;
    }
    g.innerHTML = h;
  })();

  start();
})();
</script>
</body>
</html>
